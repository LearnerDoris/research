function getStrengthBadge(s) {
  const map = {
    extreme: {bg: '#FCEBEB', text: '#791F1F', label: '极强'},
    strong: {bg: '#FAEEDA', text: '#633806', label: '强'},
    moderate: {bg: '#E6F1FB', text: '#042C53', label: '中'},
    weak: {bg: '#F1EFE8', text: '#444441', label: '弱'}
  };
  const c = map[s] || map.weak;
  return '<span style="display: inline-block; padding: 2px 7px; background: ' + c.bg + '; color: ' + c.text + '; border-radius: 4px; font-size: 11px; font-weight: 500;">' + c.label + '</span>';
}

    if (idsActive.includes(id)) {
      btn.style.background = 'var(--color-background-info)';
      btn.style.color = 'var(--color-text-info)';
      btn.style.borderColor = 'var(--color-border-info)';
    } else {
      btn.style.background = '';
      btn.style.color = '';
      btn.style.borderColor = '';
    }
  });
}

function render() {
  let filtered = data.slice();
  if (catFilter !== 'all') filtered = filtered.filter(d => d.type === catFilter);
  if (dirFilter !== 'all') filtered = filtered.filter(d => d.direction === dirFilter);
  
  const html = filtered.map(d => {
    const promptText = '深度分析：' + d.date + ' ' + d.actor + ' 的"' + d.event + '"对 ' + d.ticker + ' 的传导机制、T+1到T+30股价走势、以及类似事件未来再发生时的可交易策略';
    return '<div style="border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 11px 13px; margin-bottom: 9px; cursor: pointer;" onmouseover="this.style.background=\'var(--color-background-secondary)\'" onmouseout="this.style.background=\'transparent\'" onclick="sendPrompt(\'' + promptText.replace(/'/g, "\\'") + '\')">'
      + '<div style="display: flex; gap: 8px; align-items: center; margin-bottom: 5px; flex-wrap: wrap;">'
      + '<span style="font-size: 11px; color: var(--color-text-secondary); font-family: var(--font-mono);">' + d.date + '</span>'
      + getTypeBadge(d.type)
      + getStrengthBadge(d.strength)
      + getDirBadge(d.direction)
      + '<span style="font-weight: 500; font-size: 13px;">' + d.actor + '</span>'
      + '</div>'
      + '<div style="font-size: 13px; margin-bottom: 7px; line-height: 1.5;">' + d.event + '</div>'
      + '<div style="display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.4fr); gap: 8px; padding-top: 7px; border-top: 0.5px dashed var(--color-border-tertiary); font-size: 12px;">'
      + '<div><span style="color: var(--color-text-secondary);">标的：</span><span style="font-family: var(--font-mono);">' + d.ticker + '</span></div>'
      + '<div><span style="color: var(--color-text-secondary);">反应（' + d.lag + '）：</span>' + d.reaction + '</div>'
      + '</div>'
      + '<div style="font-size: 11px; color: var(--color-text-secondary); margin-top: 6px; padding-top: 6px; border-top: 0.5px dashed var(--color-border-tertiary); line-height: 1.55;">' + d.note + '</div>'
      + '</div>';
  }).join('');
  document.getElementById('data-table').innerHTML = html || '<div style="padding: 1rem; text-align: center; color: var(--color-text-secondary);">无匹配数据</div>';
  
  document.getElementById('m-total').textContent = filtered.length;
  document.getElementById('m-strong').textContent = filtered.filter(d => d.strength === 'extreme' || d.strength === 'strong').length;
  const bull = filtered.filter(d => d.direction === 'bullish').length;
  const bear = filtered.filter(d => d.direction === 'bearish').length;
  document.getElementById('m-direction').textContent = bull + ' / ' + bear;
}

function filterCat(c) {
  catFilter = c;
  setBtnActive(['btn-' + c], ['btn-all','btn-product','btn-comment','btn-investment','btn-mna','btn-macro']);
  render();
}

function filterDir(d) {
  dirFilter = d;
  const idMap = {all: 'dir-all', bullish: 'dir-bull', bearish: 'dir-bear'};
  setBtnActive([idMap[d]], ['dir-all','dir-bull','dir-bear']);
  render();
}

filterCat('all');
filterDir('all');
</script>

</div>
</body></html>
