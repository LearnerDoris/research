<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>P4 Oral — Study Cards</title>
<style>
  :root {
    --bg: #F7F6F2;
    --card: #FFFFFF;
    --text: #1C1C1A;
    --text-sub: #6B6B67;
    --text-muted: #A8A8A4;
    --border: #E8E7E2;
    --radius-card: 24px;
    --radius-btn: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.07);
    --green: #16A34A;
    --green-bg: #DCFCE7;
    --orange: #D97706;
    --orange-bg: #FEF3C7;
    --blue: #2563EB;
    --blue-bg: #EFF6FF;
    --pad: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100vh;
    height: -webkit-fill-available;
  }

  /* ── TOP BAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px var(--pad) 12px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }
  .topbar-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .score-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--green-bg);
    color: var(--green);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 40px;
  }
  .score-badge .star { font-size: 18px; }

  /* ── TOPIC FILTER ── */
  .topic-scroll {
    padding: 0 var(--pad) 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: nowrap;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .topic-scroll::-webkit-scrollbar { display: none; }
  .topic-pill {
    display: inline-block;
    padding: 9px 18px;
    border-radius: 40px;
    font-size: 14px;
    font-weight: 500;
    border: 2px solid transparent;
    cursor: pointer;
    margin-right: 8px;
    transition: transform 0.12s;
    user-select: none;
  }
  .topic-pill:active { transform: scale(0.95); }

  /* ── PROGRESS ── */
  .progress-wrap {
    padding: 0 var(--pad) 10px;
    flex-shrink: 0;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .progress-label { font-size: 13px; color: var(--text-muted); }
  .progress-count { font-size: 13px; font-weight: 600; color: var(--text-sub); }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ADE80, #22C55E);
    border-radius: 3px;
    transition: width 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* ── CARD STACK ── */
  .card-area {
    flex: 1;
    overflow: hidden;
    padding: 0 var(--pad);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .flashcard {
    background: var(--card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .flashcard:active { transform: scale(0.99); }

  .card-header {
    padding: 20px 22px 16px;
    border-bottom: 1.5px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-type {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .card-topic-chip {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 20px;
  }

  .card-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 22px 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }
  .card-question {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--text);
    letter-spacing: -0.2px;
  }

  .divider {
    height: 1.5px;
    background: var(--border);
    border-radius: 1px;
    flex-shrink: 0;
  }

  .answer-block { display: none; }
  .answer-block.visible { display: flex; flex-direction: column; gap: 14px; }

  .answer-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #2563EB;
  }
  .answer-text {
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
  }
  .tip-box {
    background: #FFFBEB;
    border: 1.5px solid #FDE68A;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #92400E;
  }
  .tip-box strong { font-weight: 600; }

  .tap-hint {
    text-align: center;
    padding: 12px;
    font-size: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .tap-hint span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* ── BOTTOM CONTROLS ── */
  .bottom-bar {
    padding: 12px var(--pad) 24px;
    flex-shrink: 0;
    background: var(--bg);
  }

  .rating-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    display: none;
  }
  .rating-row.visible { display: flex; }
  .rating-btn {
    flex: 1;
    padding: 14px 0;
    border-radius: var(--radius-btn);
    border: 2px solid;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    -webkit-appearance: none;
  }
  .rating-btn:active { transform: scale(0.96); }
  .rating-btn.got-it {
    background: var(--green-bg);
    border-color: #86EFAC;
    color: var(--green);
  }
  .rating-btn.practice {
    background: var(--orange-bg);
    border-color: #FCD34D;
    color: var(--orange);
  }
  .btn-icon { font-size: 20px; }

  .nav-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, opacity 0.1s;
    flex-shrink: 0;
    -webkit-appearance: none;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.3; }
  .shuffle-btn {
    flex: 1;
    height: 56px;
    border-radius: var(--radius-btn);
    border: 2px solid var(--border);
    background: var(--card);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    -webkit-appearance: none;
    transition: transform 0.1s;
  }
  .shuffle-btn:active { transform: scale(0.97); }

  /* ── CELEBRATION ── */
  .celebration {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.95);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 100;
    padding: var(--pad);
    text-align: center;
  }
  .celebration.visible { display: flex; }
  .celebration-emoji { font-size: 72px; }
  .celebration-title { font-size: 28px; font-weight: 800; color: var(--text); }
  .celebration-sub { font-size: 16px; color: var(--text-sub); line-height: 1.5; }
  .celebration-stats {
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  .stat-box {
    background: var(--bg);
    border-radius: 18px;
    padding: 16px 24px;
    text-align: center;
    border: 1.5px solid var(--border);
  }
  .stat-num { font-size: 32px; font-weight: 800; }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .restart-btn {
    background: #1C1C1A;
    color: #fff;
    border: none;
    border-radius: var(--radius-btn);
    padding: 18px 40px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    -webkit-appearance: none;
    transition: transform 0.1s;
  }
  .restart-btn:active { transform: scale(0.97); }

  /* ── TOPIC COLORS ── */
  .t-school { background: #EFF6FF; color: #1D4ED8; }
  .t-family { background: #F0FDF4; color: #15803D; }
  .t-community { background: #F7FEE7; color: #4D7C0F; }
  .t-health { background: #FFFBEB; color: #B45309; }
  .t-festivals { background: #FFF7ED; color: #C2410C; }
  .t-values { background: #F5F3FF; color: #6D28D9; }

  .pill-school { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
  .pill-family { background: #F0FDF4; color: #15803D; border-color: #BBF7D0; }
  .pill-community { background: #F7FEE7; color: #4D7C0F; border-color: #D9F99D; }
  .pill-health { background: #FFFBEB; color: #B45309; border-color: #FDE68A; }
  .pill-festivals { background: #FFF7ED; color: #C2410C; border-color: #FDBA74; }
  .pill-values { background: #F5F3FF; color: #6D28D9; border-color: #DDD6FE; }
  .pill-all { background: #F7F6F2; color: #1C1C1A; border-color: #D1D1CC; }
  .pill-active { border-width: 2.5px; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-title">P4 Oral Cards</div>
    <div class="topbar-sub" id="topbarSub">25 cards · All topics</div>
  </div>
  <div class="score-badge">
    <span class="star">⭐</span>
    <span id="scoreCount">0</span>
  </div>
</div>

<!-- TOPIC FILTERS -->
<div class="topic-scroll" id="topicNav"></div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-row">
    <span class="progress-label">Progress</span>
    <span class="progress-count" id="progressCount">0 / 25 done</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<!-- CARD -->
<div class="card-area">
  <div class="flashcard" id="flashcard" onclick="toggleReveal()">
    <div class="card-header">
      <span class="card-type" id="cardType"></span>
      <span class="card-topic-chip" id="cardTag"></span>
    </div>
    <div class="card-body" id="cardBody">
      <div class="card-question" id="cardQ"></div>
      <div class="divider" id="divider" style="display:none;"></div>
      <div class="answer-block" id="answerBlock">
        <div class="answer-label">Model Answer</div>
        <div class="answer-text" id="cardA"></div>
        <div class="tip-box" id="cardTip"></div>
      </div>
    </div>
  </div>
  <div class="tap-hint" id="tapHint">
    <span>👆 Tap card to see the answer</span>
  </div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="rating-row" id="ratingRow">
    <button class="rating-btn got-it" onclick="rate('got')">
      <span class="btn-icon">✅</span> I got it!
    </button>
    <button class="rating-btn practice" onclick="rate('practice')">
      <span class="btn-icon">🔁</span> Practice more
    </button>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">←</button>
    <button class="shuffle-btn" onclick="shuffle()">🔀 Shuffle</button>
    <button class="nav-btn" id="nextBtn" onclick="navigate(1)">→</button>
  </div>
</div>

<!-- CELEBRATION SCREEN -->
<div class="celebration" id="celebration">
  <div class="celebration-emoji">🎉</div>
  <div class="celebration-title">Well done!</div>
  <div class="celebration-sub">You've gone through all the cards.<br>Check your score below!</div>
  <div class="celebration-stats">
    <div class="stat-box">
      <div class="stat-num" id="gotItCount" style="color:#16A34A;">0</div>
      <div class="stat-label">I got it!</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="practiceCount" style="color:#D97706;">0</div>
      <div class="stat-label">Practice more</div>
    </div>
  </div>
  <button class="restart-btn" onclick="restart()">Try again</button>
</div>

<script>
const TOPICS = [
  { id: "all",       label: "All topics",       pillClass: "pill-all" },
  { id: "school",    label: "🏫 School",         pillClass: "pill-school" },
  { id: "family",    label: "👨‍👩‍👧 Family",    pillClass: "pill-family" },
  { id: "community", label: "🌳 Community",      pillClass: "pill-community" },
  { id: "health",    label: "🥗 Health",         pillClass: "pill-health" },
  { id: "festivals", label: "🎉 Festivals",      pillClass: "pill-festivals" },
  { id: "values",    label: "💛 Values",         pillClass: "pill-values" },
];

const ALL_CARDS = [
  { topic:"school", type:"Personal experience",
    q:"What do you usually eat at your school canteen?",
    a:"I usually eat chicken rice because it is filling and gives me energy for afternoon classes. I also like to buy a cup of barley water to cool myself down, especially after a long recess.",
    tip:"💡 Always give a reason. Don't just say 'I eat rice.' Say WHY you like it." },
  { topic:"school", type:"Opinion question",
    q:"Do you enjoy doing group projects? Why or why not?",
    a:"Yes, I do enjoy group projects most of the time. Working with friends means we can share different ideas and split the workload fairly. For example, during a recent project on recycling, each of us researched a different part and combined it together. However, it can be challenging if some members do not do their share.",
    tip:"💡 Use 'for example' to make your answer richer. Acknowledge both sides — this impresses the examiner!" },
  { topic:"school", type:"Opinion question",
    q:"What makes a good team member?",
    a:"A good team member listens carefully to others' ideas without interrupting, and is willing to share the workload fairly. He or she should also be responsible and complete tasks on time. Most importantly, a good team member encourages others and stays positive even when things get difficult.",
    tip:"💡 Give at least 2 qualities. Use connecting words: 'most importantly', 'also', 'furthermore'." },
  { topic:"school", type:"Opinion question",
    q:"Why is reading important for students?",
    a:"Reading is very important because it helps us build our vocabulary and improve our language skills. When we read widely, we also learn about different topics and broaden our knowledge. For example, I once read a book about space exploration and found it so fascinating that I started researching more on my own.",
    tip:"💡 Always relate back to your own life with a personal example — it makes your answer real." },
  { topic:"school", type:"Opinion question",
    q:"How can students make their school a better place?",
    a:"Students can help keep the school clean by disposing of litter properly and not vandalising school property. We can also be kind and inclusive, making sure no one feels left out during recess. Participating actively in school events like Sports Day also creates a strong sense of community.",
    tip:"💡 Suggest 2–3 practical actions. Be specific, not vague — say exactly what students can do." },
  { topic:"family", type:"Personal experience",
    q:"Do you enjoy spending time with your family? Tell me about it.",
    a:"Yes, I really enjoy spending time with my family. On weekends, we sometimes go to East Coast Park together. We cycle along the path, then stop for a picnic. I love these outings because we get to talk and laugh without being distracted by our phones, and it makes me feel very close to my family.",
    tip:"💡 Paint a picture! Name the place, describe what you do, then say how it makes you feel." },
  { topic:"family", type:"Opinion question",
    q:"Why is it important for families to spend time together?",
    a:"I think it is very important because it helps family members understand each other better. When we spend time together, we share our thoughts and feelings, and we feel loved and supported. It also creates happy memories that we will treasure for a long time, and strengthens the bond between family members.",
    tip:"💡 Give 2 reasons. Use 'because', 'also', 'furthermore' to link your ideas smoothly." },
  { topic:"family", type:"Opinion question",
    q:"How can children help out at home?",
    a:"Children can help with simple chores such as washing the dishes, sweeping the floor, or taking out the rubbish. We can also help younger siblings with their homework or keep our rooms tidy without being reminded. Helping at home teaches us responsibility and shows our appreciation for what our parents do for us.",
    tip:"💡 Give specific examples of chores, not just 'do housework'. The more specific, the better!" },
  { topic:"family", type:"Opinion question",
    q:"How should we treat our elderly grandparents?",
    a:"We should treat our elderly grandparents with patience, love, and respect. We can spend time talking with them, listening to their stories, or accompanying them on walks. We should also be careful not to speak harshly to them, and offer to help them with tasks that may be difficult due to their age.",
    tip:"💡 Show empathy in your answer. Examiners reward kind, thoughtful responses that show good values." },
  { topic:"community", type:"Opinion question",
    q:"Why is it important to keep Singapore clean?",
    a:"Keeping Singapore clean is important because it makes our environment pleasant and healthy for everyone. A clean environment also prevents the spread of diseases and keeps pests like rats and mosquitoes away. I believe every citizen has a role to play — for example, by disposing of litter properly and not leaving food waste in public areas.",
    tip:"💡 Start with the general reason, then get specific with an example from everyday life." },
  { topic:"community", type:"Opinion question",
    q:"How can we be a good neighbour?",
    a:"We can be a good neighbour by being considerate — for example, keeping noise levels down late at night and not leaving our belongings in shared corridors. We can also greet our neighbours warmly and offer to help if they need assistance, such as collecting their mail when they are away.",
    tip:"💡 'For example' is your best friend. Always follow a point with a concrete, real-life example." },
  { topic:"community", type:"General knowledge",
    q:"What outdoor activities do Singaporeans enjoy?",
    a:"Many Singaporeans enjoy cycling, jogging, and hiking. Families often visit green spaces like Gardens by the Bay or nature reserves like Bukit Timah Hill. These activities are not only enjoyable but also beneficial for our health. I personally enjoy cycling at Punggol Waterway with my family on weekends.",
    tip:"💡 Name real Singapore places — it shows the examiner you know your country well!" },
  { topic:"community", type:"Opinion question",
    q:"How can we practise road safety?",
    a:"We can practise road safety by always using pedestrian crossings and waiting for the green man before crossing. We should also avoid using our phones while walking near roads, as this can be very dangerous. As cyclists, we should wear a helmet and follow traffic rules. Road safety protects not just ourselves but others too.",
    tip:"💡 Include safety tips for different groups: pedestrians, cyclists, passengers. Shows wide thinking!" },
  { topic:"health", type:"Opinion question",
    q:"Why is it important to eat a proper lunch?",
    a:"Eating a proper lunch is very important because it gives us the energy we need to concentrate during afternoon lessons. If I skip lunch, I feel tired and find it hard to pay attention to my teacher. A nutritious meal also keeps us healthy and helps our bodies grow and develop properly.",
    tip:"💡 Use first person ('if I skip lunch') to make the answer feel personal and convincing." },
  { topic:"health", type:"Opinion question",
    q:"How much time should students spend on devices each day?",
    a:"I think students should limit their screen time to about one to two hours a day outside of school. Spending too much time on devices can strain our eyes and affect our sleep. Instead, we should spend time on physical activities, reading, or playing with friends. Balance is important — devices can be useful, but we should not be overly dependent on them.",
    tip:"💡 Give a specific time limit (e.g. 1–2 hours), not just 'not too much'. Show you understand both sides." },
  { topic:"health", type:"Opinion question",
    q:"What can students do to stay healthy?",
    a:"Students can stay healthy by eating balanced meals with plenty of vegetables and fruits, and avoiding too much junk food or sugary drinks. Regular exercise is also important — even a 30-minute jog or swim a few times a week can make a big difference. Getting enough sleep each night is equally essential so that we feel refreshed and alert in school.",
    tip:"💡 Cover at least 3 areas: diet, exercise, sleep. This shows the examiner a well-rounded answer." },
  { topic:"health", type:"Opinion question",
    q:"Why is exercise important for children?",
    a:"Exercise is very important for children because it keeps our bodies strong and healthy. It also helps us manage stress and improves our mood — I always feel happier and more focused after a game of basketball. Regular exercise also teaches us teamwork and discipline, especially when we play as part of a team.",
    tip:"💡 Include both physical AND emotional benefits of exercise. Two types of reasons = stronger answer." },
  { topic:"festivals", type:"Personal experience",
    q:"What is your favourite festival and why?",
    a:"My favourite festival is Chinese New Year. I love it because the whole family gathers together, which is rare during the rest of the year. We visit relatives, exchange red packets, and enjoy a reunion dinner with special dishes like pineapple tarts and bak kwa. It is a time filled with warmth, laughter, and a strong sense of togetherness.",
    tip:"💡 Name specific foods, traditions, or activities — vivid details make your answer memorable!" },
  { topic:"festivals", type:"General knowledge",
    q:"How do Singaporeans celebrate National Day?",
    a:"Singaporeans celebrate National Day on 9 August each year. Many families gather to watch the National Day Parade, either in person or on television at home. Buildings and void decks are decorated with Singapore flags, and fireworks light up the sky at night. It is a time for all Singaporeans to feel proud of our country and reflect on how far we have come.",
    tip:"💡 Show national pride in your answer! Mention the date (9 August) — it shows you know your facts." },
  { topic:"festivals", type:"Opinion question",
    q:"Why are festivals important in Singapore?",
    a:"Festivals are important because they bring people of different races and religions together, strengthening our multicultural identity. When we celebrate each other's festivals, we learn about different cultures and traditions, which promotes understanding and racial harmony. Festivals also give families a chance to reconnect and spend quality time together.",
    tip:"💡 In a Singapore context, always mention racial harmony — it's a key national value examiners love." },
  { topic:"values", type:"Personal experience",
    q:"Tell me about a time you helped someone.",
    a:"Once, I noticed a classmate struggling to carry a heavy stack of books to the library. I offered to help, and we carried them together. She was very grateful and thanked me. It was a small act, but it made me realise how a simple gesture of kindness can brighten someone's day and strengthen friendship.",
    tip:"💡 Use the structure: Situation → Action → Outcome → Reflection. This makes your story very clear!" },
  { topic:"values", type:"Opinion question",
    q:"Why is honesty important?",
    a:"Honesty is very important because it builds trust between people. When we are honest, others know they can rely on us and take us at our word. For example, if I accidentally broke something at home and lied about it, my parents might find out later and trust me less. Being honest, even when it is difficult, shows courage and strong character.",
    tip:"💡 Give a relatable example. Talking about honesty in abstract terms is less convincing than a real scenario." },
  { topic:"values", type:"Personal experience",
    q:"How do you handle failure or disappointment?",
    a:"When I fail at something, I first allow myself to feel disappointed — I think it is natural to feel upset. But then I try to reflect on what went wrong and what I can do better next time. For example, when I did not do well in a spelling test, I made a list of the words I had missed and practised them every day until I knew them perfectly.",
    tip:"💡 Show emotional maturity — it is okay to feel sad, but show that you bounce back and learn from it." },
  { topic:"values", type:"Opinion question",
    q:"What does it mean to be a responsible person?",
    a:"A responsible person is someone who takes ownership of their actions and duties. For example, a responsible student completes their homework on time without being reminded, and owns up to mistakes rather than blaming others. Responsibility also means thinking about how our actions affect the people around us.",
    tip:"💡 Define the value first, then show what it looks like with a concrete example from school life." },
  { topic:"values", type:"Opinion question",
    q:"Why is it important to be grateful?",
    a:"Being grateful is important because it helps us appreciate what we have instead of always wanting more. When we express gratitude — for example, by thanking a teacher who has helped us or a parent who has cooked a meal — it makes the other person feel valued and strengthens our relationship with them. Gratitude also makes us happier and more content.",
    tip:"💡 Explain what gratitude does for US and for OTHERS — two angles make for a much richer answer." },
];

const TOPIC_TAG_CLASS = { school:"t-school", family:"t-family", community:"t-community", health:"t-health", festivals:"t-festivals", values:"t-values" };
const TOPIC_LABELS = { school:"School life", family:"Family & home", community:"Community", health:"Health", festivals:"Festivals", values:"Values" };

let activeTopic = "all";
let deck = [...ALL_CARDS];
let idx = 0;
let revealed = false;
let ratings = {};
let doneSet = new Set();

function buildNav() {
  const nav = document.getElementById("topicNav");
  nav.innerHTML = "";
  TOPICS.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "topic-pill " + t.pillClass + (t.id === activeTopic ? " pill-active" : "");
    btn.textContent = t.label;
    btn.onclick = () => setTopic(t.id);
    nav.appendChild(btn);
  });
}

function setTopic(id) {
  activeTopic = id;
  deck = id === "all" ? [...ALL_CARDS] : ALL_CARDS.filter(c => c.topic === id);
  idx = 0; revealed = false; doneSet = new Set(); ratings = {};
  buildNav();
  updateTopbarSub();
  renderCard();
}

function updateTopbarSub() {
  const label = TOPICS.find(t => t.id === activeTopic).label.replace(/^[^\s]+ /, "");
  document.getElementById("topbarSub").textContent = deck.length + " cards · " + (activeTopic === "all" ? "All topics" : label);
}

function shuffle() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  idx = 0; revealed = false; doneSet = new Set(); ratings = {};
  renderCard();
}

function navigate(dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= deck.length) return;
  idx = newIdx; revealed = false;
  renderCard();
}

function toggleReveal() {
  revealed = !revealed;
  const ab = document.getElementById("answerBlock");
  const div = document.getElementById("divider");
  const hint = document.getElementById("tapHint");
  const ratingRow = document.getElementById("ratingRow");
  if (revealed) {
    ab.classList.add("visible");
    div.style.display = "block";
    hint.innerHTML = '<span>👇 How did you do?</span>';
    ratingRow.classList.add("visible");
  } else {
    ab.classList.remove("visible");
    div.style.display = "none";
    hint.innerHTML = '<span>👆 Tap card to see the answer</span>';
    ratingRow.classList.remove("visible");
  }
}

function rate(r) {
  const key = idx;
  ratings[key] = r;
  doneSet.add(key);
  if (r === "got") {
    document.getElementById("scoreCount").textContent = Object.values(ratings).filter(v => v === "got").length;
  }
  updateProgress();
  if (idx < deck.length - 1) {
    setTimeout(() => { idx++; revealed = false; renderCard(); }, 200);
  } else {
    setTimeout(showCelebration, 300);
  }
}

function updateProgress() {
  const done = doneSet.size;
  const total = deck.length;
  document.getElementById("progressFill").style.width = (done / total * 100) + "%";
  document.getElementById("progressCount").textContent = done + " / " + total + " done";
}

function showCelebration() {
  const gotIt = Object.values(ratings).filter(v => v === "got").length;
  const practice = Object.values(ratings).filter(v => v === "practice").length;
  document.getElementById("gotItCount").textContent = gotIt;
  document.getElementById("practiceCount").textContent = practice;
  document.getElementById("celebration").classList.add("visible");
}

function restart() {
  document.getElementById("celebration").classList.remove("visible");
  idx = 0; revealed = false; doneSet = new Set(); ratings = {};
  document.getElementById("scoreCount").textContent = "0";
  updateProgress();
  renderCard();
}

function renderCard() {
  if (!deck.length) return;
  const card = deck[idx];
  document.getElementById("cardType").textContent = card.type;
  document.getElementById("cardQ").textContent = card.q;
  document.getElementById("cardA").textContent = card.a;
  document.getElementById("cardTip").textContent = card.tip;
  const tag = document.getElementById("cardTag");
  tag.textContent = TOPIC_LABELS[card.topic];
  tag.className = "card-topic-chip " + (TOPIC_TAG_CLASS[card.topic] || "");
  const ab = document.getElementById("answerBlock");
  const div = document.getElementById("divider");
  const hint = document.getElementById("tapHint");
  const ratingRow = document.getElementById("ratingRow");
  ab.classList.remove("visible");
  div.style.display = "none";
  hint.innerHTML = '<span>👆 Tap card to see the answer</span>';
  ratingRow.classList.remove("visible");
  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === deck.length - 1;
  document.getElementById("cardBody").scrollTop = 0;
  updateProgress();
}

buildNav();
updateTopbarSub();
renderCard();
</script>
</body>
</html>
